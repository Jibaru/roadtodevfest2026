<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Agent Arena · Stage</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css?family=Google+Sans:400,500,700|Roboto+Mono:400,500&display=swap" rel="stylesheet">
<link href="https://fonts.googleapis.com/css2?family=Material+Symbols+Rounded:opsz,wght,FILL,GRAD@20..48,400..700,1,0&display=block" rel="stylesheet">
<style>
  :root {
    /* DevFest design tokens (developers.google.com/community/devfest) */
    --ink: #1e1e1e; --ink-soft: #5f6368; --bg: #ffffff; --surface: #f8f9fa;
    --border: #dadce0;
    --blue: #1967d2; --blue-core: #4285f4; --blue-pastel: #e8f0fe;
    --red: #ea4335; --red-pastel: #fce8e6;
    --yellow: #f9ab00; --yellow-pastel: #fef7e0; --yellow-ink: #b06f00;
    --green: #34a853; --green-bright: #5cdb6d; --green-pastel: #e6f4ea; --green-ink: #1e7e34;
    --r-card: 24px; --r-pill: 50px; --r-input: 16px;
    --ease-strong: cubic-bezier(0.23, 1, 0.32, 1);
    --elev-1: 0 1px 2px rgba(60,64,67,.3), 0 1px 3px 1px rgba(60,64,67,.15);
  }
  * { box-sizing: border-box; margin: 0; padding: 0; }
  body { background: var(--bg); color: var(--ink);
    font-family: 'Google Sans', 'Product Sans', Roboto, system-ui, sans-serif;
    min-height: 100vh; padding: 24px 28px; overflow-x: hidden; }
  body::before {
    content: ""; position: fixed; inset: 0; pointer-events: none; z-index: -1;
    background-image: radial-gradient(circle, rgba(66,133,244,.14) 1.2px, transparent 1.2px);
    background-size: 28px 28px;
    -webkit-mask-image: radial-gradient(ellipse at 50% 30%, #000 30%, transparent 80%);
    mask-image: radial-gradient(ellipse at 50% 30%, #000 30%, transparent 80%);
  }
  .ms { font-family: 'Material Symbols Rounded'; font-weight: normal; font-style: normal;
    line-height: 1; display: inline-block; vertical-align: -0.18em; font-size: 1.25em;
    letter-spacing: normal; white-space: nowrap; -webkit-font-smoothing: antialiased; }
  .top { display: flex; justify-content: space-between; align-items: center; margin-bottom: 20px;
    flex-wrap: wrap; gap: 12px; }
  h1 { font-size: 1.7rem; font-weight: 700; letter-spacing: .01em;
    display: flex; align-items: center; gap: 10px; }
  h1 > .ms { color: var(--blue); }
  h1 .vs { color: var(--ink-soft); font-weight: 400; font-size: 1.05rem; }
  .bk { color: var(--blue); font-weight: 700; }
  .brand { font-size: .78rem; font-weight: 500; letter-spacing: .1em; color: var(--ink-soft);
    text-transform: uppercase; }
  .join { font-size: 1.1rem; background: var(--blue-pastel); padding: 12px 22px;
    border-radius: var(--r-pill); display: flex; align-items: center; gap: 8px; }
  .join .ms, .join b { color: var(--blue); }
  .grid { display: grid; grid-template-columns: 2fr 1fr; gap: 20px; }
  .card { background: var(--surface); border-radius: var(--r-card); padding: 26px;
    box-shadow: var(--elev-1); }
  .card.blue { background: var(--blue-pastel); }
  @keyframes rise { from { opacity: 0; transform: translateY(10px); } to { opacity: 1; transform: none; } }
  .phase-banner { text-align: center; font-size: 1rem; font-weight: 700; letter-spacing: .12em;
    color: var(--blue); text-transform: uppercase; margin-bottom: 16px; }
  .topic { text-align: center; font-size: 1.6rem; font-weight: 700; margin-bottom: 14px;
    animation: rise .4s var(--ease-strong) both; }
  .topic.mono { font-family: 'Roboto Mono', monospace; }
  .reviewers { display: grid; grid-template-columns: 1fr 1fr 1fr; gap: 14px; }
  .reviewer { text-align: center; padding: 18px 10px; border-radius: var(--r-card);
    background: var(--bg); border: 1px solid var(--border);
    transition: border-color .3s, background .3s; animation: rise .4s var(--ease-strong) both; }
  .avatar { width: 60px; height: 60px; border-radius: 50%; display: inline-flex;
    align-items: center; justify-content: center; margin-bottom: 8px; }
  .avatar .ms { font-size: 2.1rem; color: #fff; vertical-align: 0; }
  .avatar.bugs { background: var(--red); }
  .avatar.security { background: var(--yellow); }
  .avatar.simplify { background: var(--blue); }
  .reviewer b { display: block; font-size: .95rem; }
  .reviewer .status { font-size: .78rem; color: var(--ink-soft); margin-top: 6px; min-height: 2.2em;
    font-family: 'Roboto Mono', monospace; word-break: break-all; }
  .reviewer.working { border-color: var(--yellow); background: var(--yellow-pastel); }
  .reviewer.working .avatar { animation: bob 1.1s ease-in-out infinite; }
  .reviewer.done { border-color: var(--green); background: var(--green-pastel); }
  @keyframes bob { 0%,100% { transform: translateY(0); } 50% { transform: translateY(-5px); } }
  .repos li { display: flex; justify-content: space-between; padding: 10px 6px; font-size: 1.15rem;
    border-bottom: 1px solid var(--border); list-style: none; font-family: 'Roboto Mono', monospace;
    animation: rise .35s var(--ease-strong) both; }
  .repos li b { color: var(--blue); font-family: 'Google Sans', sans-serif; }
  .summary { font-style: italic; color: var(--ink-soft); font-size: 1.05rem; text-align: center;
    margin: 0 0 14px; }
  .finding { background: var(--bg); border: 1px solid var(--border); border-radius: var(--r-input);
    padding: 12px 16px; margin-bottom: 10px; animation: rise .4s var(--ease-strong) both;
    display: flex; align-items: center; gap: 12px; }
  .sev { font-size: .68rem; font-weight: 700; text-transform: uppercase; letter-spacing: .05em;
    padding: 3px 10px; border-radius: var(--r-pill); color: #fff; flex-shrink: 0; }
  .sev.high { background: var(--red); } .sev.medium { background: var(--yellow); color: var(--ink); }
  .sev.low { background: var(--border); color: var(--ink); }
  .finding .who .ms { font-size: 1.3rem; }
  .finding .txt { min-width: 0; }
  .finding b { font-size: 1rem; display: block; }
  .finding .file { font-family: 'Roboto Mono', monospace; font-size: .75rem; color: var(--blue); }
  .finding .votes { margin-left: auto; font-weight: 700; color: var(--blue); white-space: nowrap; }
  .controls button { width: 100%; padding: 13px; margin-bottom: 10px; border: 0;
    border-radius: var(--r-pill); font-size: 1rem; font-weight: 500; cursor: pointer;
    font-family: inherit; color: #fff; display: flex; align-items: center;
    justify-content: center; gap: 8px; transform: translateY(0);
    transition: transform .08s ease, box-shadow .08s ease; }
  .controls button:active { transform: translateY(3px); box-shadow: 0 0 0 transparent !important; }
  #btn-start { background: var(--green); box-shadow: 0 3px 0 #1e7e34; }
  #btn-advance { background: var(--blue); box-shadow: 0 3px 0 #14509e; }
  #btn-reset { background: var(--bg); color: var(--ink); border: 1px solid var(--border);
    box-shadow: 0 3px 0 var(--border); }
  .kv { font-size: .9rem; color: var(--ink-soft); margin: 5px 0; }
  .kv b { color: var(--ink); }
  .scores { display: flex; justify-content: center; gap: 26px; font-size: 1.5rem; font-weight: 700; }
  .scores span { display: flex; align-items: center; gap: 6px; }
  #log { font-family: 'Roboto Mono', ui-monospace, monospace; font-size: .72rem;
    color: var(--ink-soft); max-height: 160px; overflow-y: auto; margin-top: 12px; }
  #conn { display: inline-block; width: 10px; height: 10px; border-radius: 50%;
    background: var(--red); }
  #conn.ok { background: var(--green-bright); }
  .big-view { text-align: center; font-size: 2rem; font-weight: 700; padding: 30px 0;
    animation: rise .45s var(--ease-strong) both; }
  .big-view .sub { font-size: 1.05rem; color: var(--ink-soft); font-weight: 400; }

  /* Phase wipe */
  #wipe { position: fixed; inset: 0; z-index: 50; pointer-events: none; display: none; }
  #wipe.run { display: block; }
  #wipe .panel { position: absolute; inset: 0; background: var(--bg); transform: translateX(-101%); }
  #wipe.run .panel { animation: sweep .8s var(--ease-strong) forwards; }
  #wipe .stripe { position: absolute; top: 0; bottom: 0; right: -14px; width: 14px;
    background: linear-gradient(to bottom, var(--blue-core) 0 25%, var(--red) 25% 50%,
      var(--yellow) 50% 75%, var(--green) 75% 100%); }
  @keyframes sweep { 0% { transform: translateX(-101%); } 42% { transform: translateX(0); }
    58% { transform: translateX(0); } 100% { transform: translateX(101%); } }
  #wipe .label { position: absolute; inset: 0; display: flex; align-items: center;
    justify-content: center; font-weight: 700; font-size: 1.4rem; letter-spacing: .14em;
    text-transform: uppercase; color: var(--ink-soft); opacity: 0; }
  #wipe.run .label { animation: label-fade .8s linear forwards; }
  @keyframes label-fade { 0%,30% { opacity: 0; } 42%,58% { opacity: 1; } 72%,100% { opacity: 0; } }
</style>
</head>
<body>
<div class="top">
  <div>
    <div class="brand"><span class="bk">[</span> DevFest 2026 <span class="bk">]</span></div>
    <h1><span class="ms">rate_review</span>AGENT ARENA <span class="vs">live code review</span> <span id="conn"></span></h1>
  </div>
  <div class="join"><span class="ms">group_add</span>Join the jury → <b id="join-url"></b></div>
</div>
<div class="grid">
  <div class="card blue" id="main-view">
    <div class="phase-banner" id="phase">idle</div>
    <div id="content"></div>
  </div>
  <div>
    <div class="card controls">
      <button id="btn-start"><span class="ms">play_arrow</span>START SESSION</button>
      <button id="btn-advance"><span class="ms">skip_next</span>ADVANCE</button>
      <button id="btn-reset"><span class="ms">restart_alt</span>RESET</button>
      <div class="kv">Phase: <b id="kv-phase">—</b></div>
      <div class="kv">Round: <b id="kv-round">—</b></div>
      <div class="kv">Next: <b id="kv-next">start a session</b></div>
      <div id="log"></div>
    </div>
    <div class="card" style="margin-top:20px">
      <div class="scores" id="scores"></div>
    </div>
  </div>
</div>
<div id="wipe"><div class="panel"><div class="stripe"></div></div><div class="label" id="wipe-label"></div></div>
<script>
const token = new URLSearchParams(location.search).get("token") || prompt("Presenter token:");
document.getElementById("join-url").textContent = location.host;
const RV = {
  bugs: { name: "BUG HUNTER", icon: "bug_report", color: "var(--red)" },
  security: { name: "SENTINEL", icon: "security", color: "var(--yellow-ink)" },
  simplify: { name: "THE SIMPLIFIER", icon: "auto_fix_high", color: "var(--blue)" },
};
const NEXT = {
  idle: "open repo submissions", repos_open: "close submissions → crew reviews",
  reviewing: "(automatic — wait for the crew)", results: "open next round",
};
const WIPE_LABEL = {
  repos_open: "propose a repo", reviewing: "agents reviewing", results: "vote the best finding",
};
let ws, lastState = null, lastPhase = null;

function log(msg) {
  const el = document.getElementById("log");
  el.innerHTML = `<div>${new Date().toLocaleTimeString()} ${esc(msg)}</div>` + el.innerHTML;
}
function connect() {
  const proto = location.protocol === "https:" ? "wss" : "ws";
  ws = new WebSocket(`${proto}://${location.host}/ws/stage?token=${encodeURIComponent(token)}`);
  ws.onopen = () => document.getElementById("conn").classList.add("ok");
  ws.onclose = () => { document.getElementById("conn").classList.remove("ok"); setTimeout(connect, 1500); };
  ws.onmessage = (e) => {
    const { type, payload } = JSON.parse(e.data);
    if (type === "state") { lastState = payload; renderWithWipe(payload); }
    else if (type === "agent_status") {
      log(`${payload.reviewer}: ${payload.status}`);
      const el = document.getElementById("st-" + payload.reviewer);
      if (el && !payload.done) el.textContent = payload.status;
    }
    else if (type === "error") log(`error: ${payload}`);
  };
}

function renderWithWipe(s) {
  if (lastPhase === null || s.phase === lastPhase || s.phase === "idle") {
    lastPhase = s.phase;
    render(s);
    return;
  }
  lastPhase = s.phase;
  const wipe = document.getElementById("wipe");
  document.getElementById("wipe-label").textContent = WIPE_LABEL[s.phase] || "";
  wipe.classList.remove("run");
  void wipe.offsetWidth;
  wipe.classList.add("run");
  setTimeout(() => render(s), 340);
  setTimeout(() => wipe.classList.remove("run"), 820);
}

async function api(path) {
  const res = await fetch(path, {
    method: "POST",
    headers: { "X-Presenter-Token": token },
  });
  if (!res.ok && res.status !== 204) {
    const err = await res.json().catch(() => ({}));
    log(`API ${res.status}: ${err.error || path}`);
  }
}
document.getElementById("btn-start").onclick = () => api("/api/reviews");
document.getElementById("btn-advance").onclick = () => api("/api/reviews/current/advance");
document.getElementById("btn-reset").onclick = () => api("/api/reviews/current/reset");

function currentRound(s) { return s.rounds && s.rounds.length ? s.rounds[s.rounds.length - 1] : null; }
function render(s) {
  const r = currentRound(s);
  document.getElementById("phase").textContent = s.phase.replace("_", " ");
  document.getElementById("kv-phase").textContent = s.phase;
  document.getElementById("kv-round").textContent = r ? r.number : "—";
  document.getElementById("kv-next").textContent = NEXT[s.phase] || "—";
  renderScores(s);

  const c = document.getElementById("content");
  switch (s.phase) {
    case "idle":
      c.innerHTML = `<div class="big-view"><span class="ms" style="color:var(--blue);font-size:2.6rem">rate_review</span><br>
        Waiting to start…<br><span class="sub">audience joins at <b>${esc(location.host)}</b></span></div>`;
      break;
    case "repos_open": {
      const counts = Object.entries(r.repo_counts || {}).sort((a, b) => b[1] - a[1]).slice(0, 10);
      c.innerHTML = `<div class="topic"><span class="ms" style="color:var(--blue)">campaign</span> Round ${r.number}: the crowd picks a repo</div>
        <ul class="repos">${counts.map(([repo, x], i) => `<li style="animation-delay:${i * 40}ms"><span>${esc(repo)}</span><b>+${x}</b></li>`).join("") || "<li>waiting for proposals…</li>"}</ul>`;
      break;
    }
    case "reviewing":
      c.innerHTML = `<div class="topic mono"><span class="bk">[</span> ${esc(r.repo)} <span class="bk">]</span></div>
        <div class="reviewers">${["bugs","security","simplify"].map((rv) => {
          const done = (r.findings || []).some((f) => f.reviewer === rv);
          return `<div class="reviewer ${done ? "done" : "working"}">
            <span class="avatar ${rv}"><span class="ms">${RV[rv].icon}</span></span>
            <b>${RV[rv].name}</b>
            <div class="status" id="st-${rv}">${done ? "✓ findings ready" : "…"}</div></div>`;
        }).join("")}</div>`;
      break;
    case "results": {
      const votes = r.vote_counts || {};
      c.innerHTML = `<div class="topic mono"><span class="bk">[</span> ${esc(r.repo)} <span class="bk">]</span></div>
        ${r.summary ? `<p class="summary"><span class="ms">rate_review</span> ${esc(r.summary)}</p>` : ""}
        <div class="topic" style="font-size:1.05rem"><span class="ms" style="color:var(--blue)">how_to_vote</span> VOTE at <span style="color:var(--blue)">${esc(location.host)}</span></div>
        ${(r.findings || []).map((f, i) => {
          const rv = RV[f.reviewer] || RV.bugs;
          return `<div class="finding" style="animation-delay:${i * 50}ms">
            <span class="sev ${esc(f.severity)}">${esc(f.severity)}</span>
            <span class="who" style="color:${rv.color}"><span class="ms">${rv.icon}</span></span>
            <span class="txt"><b>${esc(f.title)}</b>${f.file ? `<span class="file">${esc(f.file)}</span>` : ""}</span>
            <span class="votes">${votes[f.id] || 0} ★</span>
          </div>`;
        }).join("")}`;
      break;
    }
  }
}
function renderScores(s) {
  const scores = s.scores || {};
  document.getElementById("scores").innerHTML = Object.entries(RV).map(([k, rv]) =>
    `<span style="color:${rv.color}"><span class="ms">${rv.icon}</span> ${scores[k] || 0}</span>`).join("");
}
function esc(s) {
  return String(s).replace(/[&<>"']/g, (c) => ({ "&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;" }[c]));
}
connect();
</script>
</body>
</html>
